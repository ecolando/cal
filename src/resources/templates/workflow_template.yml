# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Planit

# Automatic runs disabled while Gradescope scraping fails in Actions;
# run `py update.py` locally instead. Re-enable push/schedule when fixed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure git
      run: |
        git config --global user.name 'planit'
        git config --global user.email 'planit@tanjeffreyz.github.io'

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Retrieve assignment information
      run: |
        python --version
        python main.py
      env:
        __ENV__

    - name: Commit new outputs
      run: |
        git add . || true
        git commit -m 'Updated assignments' || true
        git push origin main
        git push -f origin main:github-pages
